<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">

    <title>vladimir.lat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            color: #111111;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(24px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "SF Pro Display",
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .wrap {
            width: 100%;
            max-width: 520px;
        }

        .links {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .card {
            width: 100%;
            min-height: 64px;

            display: flex;
            align-items: center;

            padding: 0 20px;

            border: 1px solid #e5e5e5;
            border-radius: 14px;

            background: #ffffff;
            color: #111111;

            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;

            transition:
                background-color 120ms ease,
                border-color 120ms ease,
                transform 120ms ease;
        }

        .card:hover {
            background: #fafafa;
            border-color: #d8d8d8;
        }

        .card:active {
            background: #f7f7f7;
            border-color: #d3d3d3;
            transform: scale(0.992);
        }

        .card:focus-visible {
            outline: 2px solid #111111;
            outline-offset: 3px;
        }

        .icon {
            width: 24px;
            height: 24px;

            flex: 0 0 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 18px;
        }

        .icon svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        .label {
            min-width: 0;
            flex: 1;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 15px;
            line-height: 1.2;
            font-weight: 500;
            letter-spacing: -0.1px;

            color: #111111;
        }

        .arrow {
            width: 20px;
            height: 20px;

            flex: 0 0 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-left: 16px;

            color: #111111;
        }

        .arrow svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        /*
         * Petite séparation visuelle entre
         * les projets et les comptes personnels.
         */
        .card.social-first {
            margin-top: 18px;
        }

        @media (max-width: 430px) {
            body {
                padding-left:
                    max(16px, env(safe-area-inset-left));
                padding-right:
                    max(16px, env(safe-area-inset-right));
            }

            .wrap {
                max-width: 100%;
            }

            .card {
                min-height: 60px;
                padding: 0 18px;
                border-radius: 13px;
            }

            .icon {
                width: 22px;
                height: 22px;
                flex-basis: 22px;
                margin-right: 16px;
            }

            .icon svg {
                width: 21px;
                height: 21px;
            }

            .label {
                font-size: 14.5px;
            }

            .arrow {
                margin-left: 12px;
            }

            .card.social-first {
                margin-top: 16px;
            }
        }

        @media (max-width: 350px) {
            .card {
                min-height: 58px;
                padding: 0 15px;
            }

            .icon {
                margin-right: 13px;
            }

            .label {
                font-size: 13.5px;
            }
        }
    </style>
</head>

<body>

    <main class="wrap">
        <nav class="links" aria-label="Liens">

            <!-- Société d’investissement -->
            <a
                class="card"
                href="investissement.html"
                aria-label="Société d’investissement privée"
            >
                <span class="icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="9.5"></circle>
                        <ellipse cx="12" cy="12" rx="4" ry="9.5"></ellipse>
                        <path d="M2.5 12h19"></path>
                        <path d="M4.2 6.5h15.6"></path>
                        <path d="M4.2 17.5h15.6"></path>
                    </svg>
                </span>

                <span class="label">
                    Société d’investissement privée

                <span class="arrow" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M7 17L17 7"></path>
                        <path d="M9 7h8v8"></path>

                </span>
            </a>


            <!-- Agence de mannequins -->
            <a

                        <path d="M9.5 4.5h5"></path>

                        <path d="M9.5 5.5

                    </svg>
                </span>

                <span class="label">
                    Agence de mannequins
                </span>

                <span class="arrow" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M7 17L17 7"></path>

                </span>
            </a>


            <!-- Organisation politique -->
            <a
                class="card"
                href="https://www.instagram.com/lesnouveauxperesfondateurs"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Organisation politique"
            >
                <span class="icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M3 9h18"></path>

                        <path d="M5.5 9v8"></path>

                </span>

                <span class="label">

                <span class="arrow" aria-hidden="true">

            <!-- Instagram personnel -->
            <a
                class="card social-first"
                href="https://www.instagram.com/vsljt"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <span class="icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect
                            x="3"

                        ></rect>

                        <circle
                            cx="12"
                            cy="12"

                        <circle

                    </svg>
                </span>

                <span class="label">
                    Instagram
                </span>

                <span class="arrow" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M7 17L17 7"></path>

            <!-- TikTok personnel -->
            <a
                class="card"
                href="https://www.tiktok.com/@.xcus"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="TikTok"
            >
                <span class="icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"

                        <path d="M14 4v10.2a4.2 4.2 0 1 1-3.8-4.2"></path>

                    </svg>
                </span>

                <span class="label">

                <span class="arrow" aria-hidden="true">
                    <svg

        </nav>
    </main>

</body>
</html>
