<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Liens</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
html,
body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #ffffff;
    color: #111111;
}
html {
    position: fixed;
    inset: 0;
    touch-action: none;
}
body {
    position: fixed;
    inset: 0;
    padding:
        max(72px, env(safe-area-inset-top) + 48px)
        max(14px, env(safe-area-inset-right))
        max(92px, env(safe-area-inset-bottom) + 58px)
        max(14px, env(safe-area-inset-left));
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #ffffff;
    color: #111111;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
}
.wrap {
    width: min(100%, 460px);
}
.links {
    display: flex;
    flex-direction: column;
    gap: clamp(70px, 13vh, 120px);
}
.card {
    width: 100%;
    min-height: 47px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid #dedede;
    border-radius: 11px;
    background: #ffffff;
    color: #111111;
    text-decoration: none;
    box-shadow: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-drag: none;
    touch-action: manipulation;
    transition:
        border-color .15s ease,
        background .15s ease;
}
.card:hover,
.card:active {
    border-color: #cfcfcf;
    background: #fafafa;
}
.card:focus,
.card:focus-visible {
    outline: none;
}
.ic {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #111111;
}
.ic svg {
    width: 16px;
    height: 16px;
    display: block;
}
.ctext {
    min-width: 0;
    flex: 1;
    display: flex;
    align-items: center;
}
.ctitle {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .05px;
    color: #111111;
}
.csub {
    display: none;
}
.hosting {
    position: fixed;
    left: 50%;
    bottom: max(3px, env(safe-area-inset-bottom) - 2px);
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 24px);
    padding: 6px 9px;
    border: 1px solid #e1e1e1;
    border-radius: 999px;
    background: #ffffff;
    color: #777777;
    font-size: 7px;
    font-weight: 500;
    letter-spacing: .1px;
    text-align: center;
    white-space: nowrap;
    box-shadow: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
}
@media (max-width: 430px) {
    body {
        padding:
            max(64px, env(safe-area-inset-top) + 42px)
            max(13px, env(safe-area-inset-right))
            max(86px, env(safe-area-inset-bottom) + 50px)
            max(13px, env(safe-area-inset-left));
    }
    .wrap {
        width: 100%;
    }
    .links {
        gap: clamp(65px, 12vh, 105px);
    }
    .card {
        min-height: 45px;
        padding: 8px 11px;
        border-radius: 10px;
    }
    .ic {
        width: 21px;
        height: 21px;
        flex-basis: 21px;
    }
    .ic svg {
        width: 15px;
        height: 15px;
    }
    .ctitle {
        font-size: 11px;
    }
    .hosting {
        font-size: 6.8px;
        bottom: max(2px, env(safe-area-inset-bottom) - 2px);
    }
}
@media (max-width: 360px) {
    body {
        padding-top:
            max(58px, env(safe-area-inset-top) + 38px);
    }
    .links {
        gap: clamp(55px, 11vh, 90px);
    }
    .card {
        min-height: 43px;
        padding: 8px 10px;
    }
    .ctitle {
        font-size: 10.5px;
    }
    .hosting {
        font-size: 6.5px;
    }
}
</style>
</head>
