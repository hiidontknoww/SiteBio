<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#ffffff">
    <title>vladimir.lat</title>
    <style>
        /* =========================
           RESET
        ========================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            color: #000000;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100dvh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "SF Pro Display",
                Inter,
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            padding:
                max(18px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
        }
        /* =========================
           PAGE
        ========================= */
        .page {
            width: 100%;
            max-width: 460px;
            min-height: calc(
                100dvh
                - max(18px, env(safe-area-inset-top))
                - max(12px, env(safe-area-inset-bottom))
            );
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        /* =========================
           LIENS
        ========================= */
        .links {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Même espace entre TOUS les boutons */
            gap: 24px;
            padding: 35px 0 55px;
        }
        /* =========================
           BOUTON
        ========================= */
        .card {
            width: 100%;
            height: 52px;
            flex: 0 0 52px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 11px;
            text-decoration: none;
            box-shadow: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            transition:
                background-color 120ms ease,
                color 120ms ease,
                transform 120ms ease;
        }
        .card:hover {
            background: #000000;
            color: #ffffff;
        }
        .card:active {
            transform: scale(0.992);
        }
        .card:focus {
            outline: none;
        }
        .card:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 3px;
        }
        /* =========================
           ICÔNES
        ========================= */
        .icon {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }
        .icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }
        /* =========================
           TEXTE
        ========================= */
        .label {
            min-width: 0;
            flex: 1;
            margin-left: 18px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: currentColor;
            font-size: 13.5px;
            line-height: 1;
            font-weight: 500;
            letter-spacing: -0.15px;
        }
        /* =========================
           FLÈCHE
        ========================= */
        .arrow {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            color: currentColor;
        }
        .arrow svg {
            width: 17px;
            height: 17px;
            display: block;
            transition: transform 120ms ease;
        }
        .card:hover .arrow svg {
            transform: translate(1px, -1px);
        }
        /* =========================
           HÉBERGEMENT
        ========================= */
        .hosting {
            width: 100%;
            flex: 0 0 auto;
            padding-bottom:
                max(2px, env(safe-area-inset-bottom));
            color: #000000;
            font-size: 7.5px;
            line-height: 1.2;
            font-weight: 400;
            letter-spacing: 0.08px;
            text-align: center;
            white-space: nowrap;
            -webkit-user-select: none;
            user-select: none;
        }
        /* =========================
           IPHONE / MOBILE
        ========================= */
        @media (max-width: 430px) {
            body {
                padding-left:
                    max(16px, env(safe-area-inset-left));
                padding-right:
                    max(16px, env(safe-area-inset-right));
            }
            .page {
                max-width: 100%;
            }
            .links {
                gap: 23px;
                padding-top: 30px;
                padding-bottom: 48px;
            }
            .card {
                height: 50px;
                flex-basis: 50px;
                padding: 0 15px;
                border-radius: 10px;
            }
            .icon {
                width: 21px;
                height: 21px;
                flex-basis: 21px;
            }
            .icon svg {
                width: 19px;
                height: 19px;
            }
            .label {
                margin-left: 17px;
                font-size: 13px;
                font-weight: 500;
                letter-spacing: -0.15px;
            }
            .arrow {
                width: 19px;
                height: 19px;
                flex-basis: 19px;
                margin-left: 10px;
            }
            .arrow svg {
                width: 16px;
                height: 16px;
            }
            .hosting {
                font-size: 7px;
            }
        }
        /* =========================
           PETITS ÉCRANS
        ========================= */
        @media (max-width: 360px) {
            .links {
                gap: 20px;
            }
            .card {
                height: 47px;
                flex-basis: 47px;
                padding: 0 13px;
            }
            .icon {
                width: 20px;
                height: 20px;
                flex-basis: 20px;
            }
            .icon svg {
                width: 18px;
                height: 18px;
            }
            .label {
                margin-left: 14px;
                font-size: 12px;
            }
            .arrow {
                margin-left: 7px;
            }
            .hosting {
                font-size: 6.5px;
            }
        }
        /* =========================
           ÉCRANS PEU HAUTS
        ========================= */
        @media (max-height: 700px) {
            .links {
                gap: 17px;
                padding-top: 18px;
                padding-bottom: 25px;
            }
            .card {
                height: 46px;
                flex-basis: 46px;
            }
        }
        /* =========================
           TACTILE
        ========================= */
        @media (hover: none) {
            .card:hover {
                background: #ffffff;
                color: #000000;
            }
            .card:active {
                background: #000000;
                color: #ffffff;
            }
        }
    </style>
</head>
